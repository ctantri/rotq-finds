<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple web app for collating and formatting daily grocery finds for ROTQ">
    <link rel="stylesheet" href="./style.css">
    <title>ROTQ Finds</title>
  </head>
  <body>
    <nav id="navbar">
      <p id="nav-players">Players</p>
      <p id="nav-finds">Finds</p>
      <p id="nav-summary">Summary</p>
    </nav>
    <main>
      <section id="Players-section">
        <form id="players-form">
          <fieldset>
            <legend>Players and guilds: </legend>
            <div>
              <label>Format: <i>player,guild</i> (no space around the comma), one player per line.</label>
              <textarea id="players-textarea" name="players" rows="3" cols="25"></textarea>
              <button type="button" id="load-players-button">Add players and guilds</button>
            </div>
            <div>
              <label for="guild">Select your guild: </label>
              <select id="guild" name="guild" required>
                <option value="">(Select guild)</option>
              </select>
            </div>
          </fieldset>
        </form>
      </section>
      <section id="Finds-section" class="hidden">
        <form id="finds-form">
          <fieldset>
            <legend>Find:</legend>
            <label for="player">Player: </label>
            <select id="player" name="player" required>
              <option value="">(Select player)</option>
            </select>
            <label for="price">Price: </label>
            <input type="number" id="price" name="price" min="10" max="100" required/>
            <button type="submit">Save</button>
            <span id="last-save-span">Last save: N/A</span>
            <button type="button" id="undo-button">Undo</button>
            <ul id="item-list"></ul>
          </fieldset>
        </form>
      </section>
      <section id="Summary-section" class="hidden">
        <button type="button" id="summarise-button">Generate summary</button>
        <textarea id="summary-text" rows="20" cols="50"></textarea>
      </section>
    </main>
    <footer></footer>
    <script src="./script.js"></script>
  </body>
</html>
